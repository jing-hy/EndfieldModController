    "modecontroller.addon.vkey-inject": {
      "uid": "7a3c1f22",
      "id": "modecontroller.addon.vkey-inject",
      "parent": "modecontroller.addon",
      "tree": "modecontroller",
      "depth": 3,
      "tags": [
        "panel",
        "native",
        "input"
      ],
      "name": {
        "zh": "进程内按键注入",
        "en": "In-Process Key Injection"
      },
      "description": {
        "zh": "不经 Windows 输入队列的按键注入：找 EFMI 的 `d3d11.dll` → 遍历它的**导入表**把 `GetAsyncKeyState` 换成我们的函数（**只改数据、不碰代码段**；同名模块逐个试，谁真的导入它就接谁）→ 点按钮时把该键标成“按下 180 毫秒”，EFMI 下一帧轮询就读到了，窗口一到自动放开。窗口内**第一帧给 `0x8001`、之后只给 `0x8000`**（两种常见读法都只触发一次）；真修饰键状态原样透传；**卸载时把导入表恢复原样**（否则 addon 被卸载后 EFMI 会跳进已卸载的代码）。\n",
        "en": "Key injection that bypasses the Windows input queue: find EFMI's `d3d11.dll` → walk its **import table** and swap `GetAsyncKeyState` for our function (data only, no code patching; candidates are tried until one really imports that call) → a click marks that key as held for 180 ms, EFMI's next poll sees it and it releases itself. First read returns `0x8001`, later ones `0x8000`, so both polling styles fire once. Unload restores the table.\n"
      },
      "source": [
        {
          "path": "reshade_addon/src/vkey_inject.h",
          "line": 436,
          "end_line": 1305
        }
      ],

      "fingerprint": "eb14a612c3cf14e1ee23ef3bbfb35cba33d9c9041ce287653ee5367aa8f93e13",
      "apis": [
        {
          "protocol": "rpc",
          "path": "vkey::install",
          "description": {
            "zh": "幂等安装：找到目标模块并把它导入表里的 `GetAsyncKeyState` 换掉。\n",
            "en": "Idempotent install: locate the target module and swap its imported `GetAsyncKeyState`.\n"
          },
          "key": "rpc:vkey::install"
        },
        {
          "protocol": "rpc",
          "path": "vkey::press_all",
          "description": {
            "zh": "一次按键动作（可含修饰键 + 主键），按\"动作\"计一次数。\n",
            "en": "One key action (may include modifiers plus a main key), counted once per action.\n"
          },
          "key": "rpc:vkey::press_all"
        },
        {
          "protocol": "rpc",
          "path": "hook_get_async_key_state",
          "description": {
            "zh": "替换进 EFMI 导入表的函数：我们伪造的键返回按下状态，其余的键原样转给真实的 `GetAsyncKeyState`。\n",
            "en": "The function swapped into EFMI's import table: forged keys report as held, everything else is forwarded to the real `GetAsyncKeyState`.\n"
          },
          "key": "rpc:hook_get_async_key_state"
        }
      ],

    "modecontroller.backend.api.download": {

      ],
      "name": {
        "zh": "Mod 下载",
        "en": "Mod Download"
      },
      "description": {
        "zh": "在 Mod 库页粘网址把 Mod 下回来：输入框收 http(s) 直链（去重），`ThreadPoolExecutor` 最多 4 个任务**并行**，每个任务内部再走 fastnet。文件先落在 `runtime\\downloads\\`；**能解压的复用导入链路自动解压入库**并识别角色，不能解压的留在原地并标「需手动解压」。**认得香蕉网（GameBanana）链接**：页面地址会经 apiv11 换成真实文件直链，并带出**封面图**、作者与版本；访问不上会标记任务并弹窗提示检查 VPN。下载并行、入库串行。\n",
        "en": "Paste URLs on the library page to fetch mods. Up to 4 jobs run in parallel (each through fastnet); files land in `runtime\\downloads\\`, extractable ones are imported like drag-and-drop, the rest are reported as \"manual extraction needed\". GameBanana page URLs are resolved via apiv11 into the real file URL plus cover, author and version; unreachable pops a VPN hint. Downloads parallel, importing serial.\n"
      },

        },

      "uid": "4c8be1d7",
      "id": "modecontroller.backend.config.data-root",
      "parent": "modecontroller.backend.config",
      "tree": "modecontroller",

      "tags": [
        "config",
        "paths",
        "self-heal"
      ],
      "name": {
        "zh": "数据根自愈",
        "en": "Data-root Self-healing"
      },
      "description": {
        "zh": "让配置里的路径**跟着程序目录走**：记住上次的运行目录（data_root），加载时把落在旧数据根下的绝对路径自动改回相对路径（老配置无记录时用保守启发式：路径已不存在或只剩空壳、且疑似旧根已不在用）；`store_path()` 给“写配置前”统一归一化（根内→相对、根外→绝对）；`normalize_blank_paths()` 让设置页的“留空 = 自动”真的成立（空串会被解析成数据根本身）；`ensure_dirs()` 不再在数据根之外的历史残留位置凭空建目录。修的是群反馈「我把主路径改了文件名，然后他没识别出来」「又重新给我新建了一个空白文件」。\n",
        "en": "Makes configured paths follow the program directory: remembers the previous data root, rewrites absolute paths that lived under an old root back to relative ones on load (with a conservative heuristic when there is no record: missing or empty-shell old root), normalizes every program-derived path before it is stored, makes \"leave blank = automatic\" actually work, and stops creating directories outside the current data root.\n"
      },
      "source": [
        {
          "path": "endfieldmodcontroller/config.py",
          "line": 156,
          "end_line": 408
        },
        {
          "path": "endfieldmodcontroller/config.py",
          "line": 1145,
          "end_line": 1498
        }
      ],

      "fingerprint": "3fef3f238cabe7f9e87a561782e37d0c961ecc5cf50092bf192838f62e8487e0",
      "apis": [
        {
          "protocol": "rpc",
          "path": "config.store_path",
          "description": {
            "zh": "写配置前归一化路径：落在数据根里的存相对路径，外面的原样保留。\n",
            "en": "Normalize a path before storing it: relative inside the data root, untouched outside.\n"
          },
          "key": "rpc:config.store_path"
        },
        {
          "protocol": "rpc",
          "path": "config.normalize_blank_paths",
          "description": {
            "zh": "把“留空”的路径字段按默认值回填（空串会被解析成数据根本身）。\n",
            "en": "Refill blank path fields with their defaults (an empty string resolves to the data root itself).\n"
          },
          "key": "rpc:config.normalize_blank_paths"
        },
        {
          "protocol": "rpc",
          "path": "config.ensure_dirs",
          "description": {
            "zh": "建运行目录，但绝不在数据根之外的历史残留位置凭空创建。\n",
            "en": "Create runtime directories, never resurrecting stale locations outside the data root.\n"
          },
          "key": "rpc:config.ensure_dirs"
        },
        {
          "protocol": "rpc",
          "path": "config._relocate_stale_paths",
          "description": {
            "zh": "加载时把旧数据根的绝对路径改回相对路径（数据根改名/搬家后的自愈核心）。\n",
            "en": "On load, rewrite absolute paths of an old data root back to relative ones.\n"
          },
          "key": "rpc:config._relocate_stale_paths"
        }
      ],

        "en": "Health-check generated inis against 3DMigoto's own source rules to find lines that get silently skipped: illegal/redeclared Constants, assignments to undeclared variables, keys whose `run` target is missing — **plus** (2026-10-02) uppercased cross-namespace references, which 3DMigoto drops silently because it registers variables in lowercase.\n"
      },

        "en": "Our own in-game panel: where the add-on binary lives, which directories ReShade actually scans for add-ons, whether the panel can work at all, deploying / cleaning up the panel, installing its CJK font, retiring legacy copies. NOTE — since 2026-10-02 the panel no longer locks mod hotkeys: it sends each mod's **own original key** (see `modecontroller.addon.vkey-inject`), so `panel_info.txt`'s `takeover` field now means \"are the original keys really locked\" and stays 0.\n"

    "modecontroller.backend.launch.dlss5-targets": {

      ],
      "name": {
        "zh": "XXMI 注入库",
        "en": "XXMI Injection Library"
      },
      "description": {
        "zh": "注入库（extra_libraries）里到底写什么、以及它必须和谁一致：ReShade 底座 d3d12.dll + EFMI 的 d3d11.dll（顺序不能反）。列的那份 loader 必须与 XXMI 自己会注入的那份是同一个文件（同路径它才会去重）—— importer_folder 被指到别处（实测是 Mod 库）时 XXMI 会去注入另一份同名 loader，此时不再叠加第二条，并把那个配置字段自动改回这个 XXMI 自己的目录（原值备份、可回滚）。\n",
        "en": "What goes into the injection library (extra_libraries) and who it must agree with: the ReShade base d3d12.dll plus EFMI's d3d11.dll, in that order. The loader listed must be the same file XXMI itself injects (same path, so it dedupes); when importer_folder points elsewhere XXMI injects a second same-named loader, so no second entry is added and that setting is repaired back to this installation's own directory.\n"
      },
      "source": [
        {
          "path": "endfieldmodcontroller/launcher.py",
          "line": 249,
          "end_line": 400
        },
        {

      "apis": [
        {
          "protocol": "rpc",
          "path": "dlss5_injection_targets",
          "description": {
            "zh": "这次部署里注入库该列哪些 dll：ReShade 底座 + EFMI loader（后者与 XXMI 自己那份同路径时才列）。\n",
            "en": "Which DLLs the injection library should list: the ReShade base plus the EFMI loader (listed only when it is the same file XXMI itself injects).\n"
          },
          "key": "rpc:dlss5_injection_targets"
        },
        {
          "protocol": "rpc",
          "path": "configure_dlss5_injection",
          "description": {
            "zh": "一步配好注入库及其签名（先纠正 XXMI 的 EFMI 运行目录、再重新读配置写入）。\n",
            "en": "Configure the injection library and its signing in one step (repair XXMI's EFMI folder first, then re-read the config before writing).\n"
          },
          "key": "rpc:configure_dlss5_injection"
        },
        {
          "protocol": "rpc",
          "path": "ensure_efmi_importer_folder",
          "description": {
            "zh": "把 XXMI 的 EFMI 运行目录改回这个 XXMI 自己的那份（原值备份、可回滚）—— 避免它去注入另一个目录里的同名 loader。\n",
            "en": "Repair XXMI's EFMI importer folder back to this installation's own directory (backed up, reversible) so it stops injecting a same-named loader from elsewhere.\n"
          },
          "key": "rpc:ensure_efmi_importer_folder"
        },
        {
          "protocol": "rpc",
          "path": "xxmi_importer_folder",
          "description": {
            "zh": "读出 XXMI 的 importer_folder 现状：原值、解析路径、是否在这个 XXMI 树内、里面有没有 d3d11.dll / d3dx.ini。\n",
            "en": "Read the current importer_folder: raw value, resolved path, whether it is inside this XXMI, and whether d3d11.dll / d3dx.ini live there.\n"
          },
          "key": "rpc:xxmi_importer_folder"
        },
        {
          "protocol": "rpc",
          "path": "xxmi_foreign_loader",
          "description": {
            "zh": "判断 XXMI 自己会不会去注入一份落在这个 XXMI 之外的 loader。\n",

          "key": "rpc:xxmi_foreign_loader"

          "path": "prepare_reshade_runtime",
          "description": {

            "en": "Stage the ReShade runtime with the right environment and effect search paths.\n"
          },
          "key": "rpc:prepare_reshade_runtime"
        }
      ],

        "en": "Keeping XXMI's injection library correct: ensure the launcher exists, register our ReShade d3d12.dll and the EFMI d3d11.dll as extra libraries, point the importer at the real game folder, and keep the launcher config valid — the piece that decides whether mods load at all.\n"

    "modecontroller.backend.launch.xxmi-signing": {
      "uid": "b1d0d003",
      "id": "modecontroller.backend.launch.xxmi-signing",
      "parent": "modecontroller.backend.launch",

      "depth": 4,
      "tags": [
        "xxmi",
        "signing"
      ],
      "name": {
        "zh": "XXMI 签名密钥",
        "en": "XXMI Signing Key"
      },
      "description": {
        "zh": "XXMI 会用自己的用户密钥给配置签名；签名缺失或过期时它会重置密钥并静默清空注入列表。由我们主动生成并写入密钥，才是注入列表不被它抹掉的根据。\n",
        "en": "XXMI signs its own settings with a user key; if that signature is absent or stale it regenerates the key and quietly wipes the injection list. Generating the key ourselves is what keeps our injections from being reset out from under us.\n"
      },
      "source": [
        {
          "path": "endfieldmodcontroller/launcher.py",
          "line": 1302,
          "end_line": 4383
        }
      ],
      "revision": "20521577d9cf0d2206617a54825953f305763895",
      "updated_at": "2026-10-07T14:32:31.342Z",
      "fingerprint": "8718718362711068ee40c93f0650126fe52710c41d308509eb0d6def46d22254",
      "apis": [
        {
          "protocol": "rpc",
          "path": "ensure_xxmi_signing_key",
          "description": {
            "zh": "确保密钥对**与** `Security.user_signature` 都在 —— 否则 XXMI 会重新生成密钥，把我们写的注入列表一并作废。\n",
            "en": "Make sure both the key pair AND Security.user_signature exist — otherwise XXMI regenerates its key and wipes our injection list.\n"
          },
          "key": "rpc:ensure_xxmi_signing_key"
        },
        {
          "protocol": "rpc",
          "path": "sign_xxmi_setting",
          "description": {
            "zh": "按 XXMI 的校验方式签一个 unsecure 设置值（ECDSA P-384 + SHA-256、base64 DER）。\n",
            "en": "Sign one unsecure setting value (ECDSA P-384 + SHA-256, base64 DER) exactly as XXMI verifies it.\n"
          },
          "key": "rpc:sign_xxmi_setting"
        }
      ],
      "aggregate": {

        "own_api_count": 2,
        "inherited_api_count": 0,

      }

        "en": "Injection Timeline"

        "zh": "在启动链的五个时机各拍一张「注入现场」照片：注入库内容与签名长度、runtime\\dlss5 关键文件、游戏目录注入物、以及游戏进程里实际进了哪些模块（含「该进却没进」与「同名 loader 进了两份」两类判据）——用于把「看着注入成功、实际没进进程」与「两份 loader 撞在一起」分开。\n",
        "en": "Snapshots the injection scene at five points along the launch chain: injection-library contents and signature length, key runtime\\dlss5 files, game-directory injections, and which modules actually loaded in the game process — including the two judgements that separate \"looked injected but never entered the process\" from \"two same-named loaders colliding\".\n"
      },

    "modecontroller.backend.observe.kernel-instability": {
      "uid": "46ddaca9",
      "id": "modecontroller.backend.observe.kernel-instability",
      "parent": "modecontroller.backend.observe",
      "tree": "modecontroller",

        "crash",
        "diagnostics",
        "system-log",
        "hardware"
      ],
      "name": {
        "zh": "机器侧稳定性",
        "en": "Machine-side Stability"
      },
      "description": {
        "zh": "从 System 日志读这台机器自己的内核级事件：蓝屏（BugCheck 1001）、非正常关机（Kernel-Power 41 / EventLog 6008）、硬件错误（WHEA-Logger）与谁发起的关机（User32 1074），渲染成诊断报告里的一段与时间轴。此前只采 Application 日志，System 侧一条都拿不到。\n",
        "en": "Read the machine's own kernel-level events from the System log — bugchecks (1001), unexpected shutdowns (Kernel-Power 41 / EventLog 6008), WHEA hardware errors and who initiated a shutdown (User32 1074) — rendered as a diagnostic-report section with a timeline. Previously only the Application log was read, so nothing from the System side was ever captured.\n"
      },
      "source": [
        {
          "path": "endfieldmodcontroller/kernel_instability.py",
          "line": 1,
          "end_line": 390
        }
      ],
      "revision": "20521577d9cf0d2206617a54825953f305763895",
      "updated_at": "2026-10-07T14:33:00.728Z",
      "fingerprint": "12d919810c46ff200a7cdaabe69117e74ffbba3b9dfbb7ff2e072cd038d44945",
      "apis": [
        {
          "protocol": "rpc",
          "path": "collect_kernel_events",
          "description": {
            "zh": "采一次机器侧稳定性（System 日志，默认 30 天窗口）。采集失败时 ok=False 并如实给出原因 —— 绝不能被当成「机器是稳的」。\n",
            "en": "Collect machine-side stability once (System log, 30-day window by default). On failure ok=False with an honest reason — never to be read as \"the machine is fine\".\n"
          },
          "key": "rpc:collect_kernel_events"
        },
        {
          "protocol": "rpc",
          "path": "render_kernel_section",
          "description": {
            "zh": "把结果渲染成诊断报告里的一段（自带标题）与时间轴；调用方给了本次启动时刻时，额外汇总「距本次启动最近的一条」供对照。\n",
            "en": "Render the result as a diagnostic-report section (heading included) with a timeline; when the caller passes the launch time, also report the nearest preceding event for reference.\n"
          },
          "key": "rpc:render_kernel_section"
        }
      ],

      "name": {
        "zh": "崩溃记忆与已验证组合",
        "en": "Crash Memory & Proven Combos"
      },
      "description": {
        "zh": "让程序不唠叨的那份记忆：“哪套组合之前崩过”、“哪套后来证明能跑”（于是撤回警告）、“哪些冲突被一次成功运行否掉”，加上当前 staged Mod 清单与启动前风险包。\n",
        "en": "The memory that keeps the program from nagging: which mod combinations crashed before, which ones later proved they run fine (so the warning is withdrawn), and which conflicts were disproved by a successful run — plus the current staged mod list and the pre-launch risk payload.\n"
      },
      "source": [
        {
          "path": "endfieldmodcontroller/crashwatch.py",
          "line": 1161,
          "end_line": 4456
        }
      ],

      "apis": [
        {
          "protocol": "rpc",
          "path": "crashwatch.remember_crash",
          "description": {
            "zh": "记住刚才哪套组合崩了（同一组合只留最近一次，有上限）。\n",
            "en": "Remember which mod combination just crashed (kept last-per-combination, capped).\n"
          },
          "key": "rpc:crashwatch.remember_crash"
        },
        {
          "protocol": "rpc",
          "path": "crashwatch.read_crash_memory",
          "description": {
            "zh": "读回崩溃记忆。\n",
            "en": "Read back the crash memory.\n"
          },
          "key": "rpc:crashwatch.read_crash_memory"
        },
        {
          "protocol": "rpc",
          "path": "crashwatch.prelaunch_risks",
          "description": {
            "zh": "启动前风险包：静态冲突 + 这套组合的崩溃记忆。\n",
            "en": "The pre-launch risk payload: static conflicts + remembered crashes for this combination.\n"
          },
          "key": "rpc:crashwatch.prelaunch_risks"
        },
        {
          "protocol": "rpc",
          "path": "crashwatch.combo_succeeded",
          "description": {
            "zh": "这一趟是否**确实跑通**（正常退出，或存活 ≥ 120 秒，且无崩溃转储）。\n",
            "en": "Did this run actually succeed (normal exit, or alive ≥ 120s, and no crash dump).\n"
          },
          "key": "rpc:crashwatch.combo_succeeded"
        },
        {
          "protocol": "rpc",
          "path": "crashwatch.forget_crashes_for_combo",
          "description": {
            "zh": "跑通了就把匹配的崩溃记忆**移出** —— 不再唠叨一套明明能用的组合。\n",
            "en": "A successful run withdraws the matching crash memory — no more nagging about a combination that works.\n"
          },
          "key": "rpc:crashwatch.forget_crashes_for_combo"
        },
        {
          "protocol": "rpc",
          "path": "crashwatch.conflict_pair_proven",
          "description": {
            "zh": "这一对是否曾经一起跑通过（是则那条静态冲突推测已经作废、不再报）。\n",
            "en": "Was this pair ever proven to run together (its static conflict verdict is therefore withdrawn).\n"
          },
          "key": "rpc:crashwatch.conflict_pair_proven"
        }
      ],

      "name": {
        "zh": "主入口",
        "en": "Main Entry"
      },
      "description": {
        "zh": "把程序拉起来：拒绝第二个实例、清掉会堆在 temp 里的 _MEI 解压残留，后端就绪前先用一张静态加载页把窗口显示出来，再把控制权交给 pywebview。 ⚠️ 单实例判据 2026-10-03 升级：锁里的 PID 活着 **且**（进程指纹（exe 路径 + 创建时间）对得上 **或** 屏幕上真有我们的窗口）才算“已有实例”，否则视为陈旧锁 / PID 被复用并**直接接管** —— 旧判据只看 PID 存活，PID 被 Windows 复用后会永久误判成“已在运行”并静默退出（反馈者原话「关掉管理器，显示要管理员权限，然后就没反应了」）。真的还有一个实例时，会把那个窗口拉到最前面；退出时把锁还回去。\n",
        "en": "Start the program: refuse a second instance, clean stale _MEI folders in temp, show a static splash before the backend is ready, hand control to pywebview. The single-instance test needs the PID alive AND (process fingerprint matched OR one of our windows on screen); otherwise the lock is stale and is taken over. A real running instance gets its window brought to the front; the lock is released on exit.\n"
      },

  "layouts": {
    "modecontroller": {
      "schema_version": 1,
      "id": "modecontroller",
      "updated_at": "2026-10-02T08:38:19.592Z",
      "mode": "grid",
      "max_columns": 2,
      "reading": {
        "zh": "从后端包看起 —— 程序所有的判断都在那里。前端只单向调用后端（反过来那条不算依赖），addon 是我们自己注入游戏进程的原生面板（后端负责把它部署进 ReShade 真正会扫的目录），scripts 是开发机上的构建与发布工具，tests 把前面几者的离线行为钉住。",
        "en": "Start at the backend package — it holds every decision the program makes. The web layer only calls into it (never the other way round), the addon tree is our own native panel injected into the game process (the backend deploys it into ReShade's directory), scripts drive builds and releases from the dev machine, and tests pin the offline behaviour of both."
      },
      "order": [
        "modecontroller.backend",
        "modecontroller.addon",
        "modecontroller.web",
        "modecontroller.scripts",
        "modecontroller.tests"
      ]
    },
    "modecontroller.addon": {
      "schema_version": 1,
      "id": "modecontroller.addon",
      "updated_at": "2026-10-02T08:38:22.692Z",
      "mode": "layers",
      "max_columns": 1,
      "reading": {
        "zh": "自上而下：面板本体（动作清单 → 每项一个按钮）→ 按键注入（点一下怎么变成 EFMI 轮询真的读到的“按下”）→ 把这两层在不开游戏的情况下钉住的离线自测。",
        "en": "Top to bottom: the panel itself (action list → one button per entry) → the key injection (how a click becomes a \"key down\" that EFMI's polling actually sees) → the offline self-test that pins both layers without launching the game."
      },
      "order": [
        "modecontroller.addon.panel",
        "modecontroller.addon.vkey-inject",
        "modecontroller.addon.tests"
      ]
    },

<script>
(function () {
  'use strict'
  var DATA = JSON.parse(document.getElementById('normify-data').textContent)
  var mods = DATA.modules
  var apiIndex = DATA.api_index
  var edges = DATA.edges
  var stats = DATA.project.stats
  var trees = DATA.project.trees
  var lang = initLang()
  var current = parseHash()
  var children = {}
  var roots = []
  Object.keys(mods).forEach(function (id) {
    var m = mods[id]
    if (m.parent === null) roots.push(id)
    else (children[m.parent] = children[m.parent] || []).push(id)
  })
  roots.sort()
  Object.keys(children).forEach(function (k) { children[k].sort() })
  var depIn = {}
  edges.forEach(function (e) { (depIn[e.to] = depIn[e.to] || []).push(e) })
  var corpus = buildCorpus()

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }
  function L(o) { if (!o) return ''; return o[lang] || o.zh || '' }
  function treeRepo(treeId) { for (var i = 0; i < trees.length; i++) if (trees[i].tree_id === treeId) return trees[i].repository || null; return null }
  function idOfSegs(segs) { return segs.join('.') }
  function sourceHref(m) {
    var repo = treeRepo(m.tree)
    if (!repo || !m.source || m.source.length === 0) return null
    var s = m.source[0]
    var href = repo.replace(/\/$/, '') + '/blob/' + m.revision + '/' + s.path
    if (s.line) href += '#L' + s.line + (s.end_line && s.end_line !== s.line ? '-L' + s.end_line : '')
    return href
  }
  function initLang() {
    var p = new URLSearchParams(location.search).get('lang')
    if (p === 'zh' || p === 'en') return p
    try { var s = localStorage.getItem('normify-lang'); if (s === 'zh' || s === 'en') return s } catch (e) {}
    return (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'
  }
  function initTheme() {
    var p = new URLSearchParams(location.search).get('theme')
    var t = null
    try { t = localStorage.getItem('normify-theme') } catch (e) {}
    if (p === 'dark' || p === 'light') t = p
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
  }
  function parseHash() {
    var h = location.hash.replace(/^#/, '')
    if (h === 'trees') return { view: 'trees' }
    var params = {}
    h.split('&').forEach(function (kv) {
      if (!kv) return
      var i = kv.indexOf('=')
      if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1))
    })
    if (params.view === 'outline') return { view: 'outline' }
    if (params.view === 'apis') return { view: 'apis' }
    if (params.api) {
      var owner = apiIndex[params.api]
      if (owner) return { view: 'level', moduleId: owner, apiKey: params.api }
    }
    if (params.module && mods[params.module]) return { view: 'level', moduleId: params.module }
    if (params.tree && mods[params.tree]) return { view: 'level', moduleId: params.tree }
    return { view: 'trees' }
  }
  function buildCorpus() {
    var out = []
    Object.keys(mods).forEach(function (id) {
      var m = mods[id]
      out.push({ kind: 'module', id: id, text: (id + ' ' + m.name.zh + ' ' + m.name.en + ' ' + L(m.description)).toLowerCase() })
    })

  function estWidth(s, fs) {

  function wrapName(name, maxW, fs) {
    var s = String(name).replace(/s+/g, ' ')

    if (words.length > 1) {

      for (var i = 0; i < words.length; i++) {
        var t = cur === '' ? words[i] : cur + ' ' + words[i]
        if (estWidth(t, fs) <= maxW || cur === '') cur = t
        else { lines.push(cur); cur = words[i] }
      }
      lines.push(cur)
    } else {
      lines.push(s)

    if (lines.length > 2) lines = [lines[0], lines.slice(1).join(' ')]
    if (lines.length === 1 && estWidth(lines[0], fs) > maxW) {

      lines = [l.slice(0, cut), l.slice(cut)]

    if (lines.length === 2 && estWidth(lines[0], fs) > maxW) {

      while (cut2 < l2.length && estWidth(l2.slice(0, cut2), fs) <= maxW) cut2++
      cut2 = Math.max(1, cut2 - 1)
      lines = [l2.slice(0, cut2), l2.slice(cut2) + ' ' + lines[1]]

    return lines
  }

      for (var i = 0; i < lines.length; i++) if (estWidth(lines[i], fs) > maxW) ok = false
      best = { lines: lines, fs: fs }

    for (var j = 0; j < best.lines.length; j++) {

    return order.concat(rest)

  /** 当前层可见的模块级直连边（仅用于自动排序/分层）。 */

    var kidSet = {}
    kids.forEach(function (k) { kidSet[k] = true })
    var out = []
    kids.forEach(function (id) {
      ;(mods[id].deps || []).forEach(function (d) {

      })
    })
    return out
  }

  /**
   * 当前层要画的全部边（对齐"API 直接连线"的原始目标）：
   * - exact：两端都在本层（孩子）——用真实 from_api/to_api 锚点，一条不合并；

    var kidSet = {}
    kids.forEach(function (k) { kidSet[k] = true })

      if (kidSet[id]) return id
      for (var i = 0; i < kids.length; i++) {

        if (id.length > k.length && id.indexOf(k + '.') === 0) return k
      }
      return null
    }
    var exact = []
    var seenExact = {}
    var aggMap = {}
    Object.keys(mods).forEach(function (srcId) {
      var m = mods[srcId]
      ;(m.deps || []).forEach(function (d) {
        var from = visibleOf(srcId)
        var to = visibleOf(d.to)
        if (from === null || to === null || from === to) return
        if (kidSet[srcId] && kidSet[d.to]) {
          var sig = srcId + '|' + d.to + '|' + (d.from_api || '') + '|' + (d.to_api || '') + '|' + d.kind
          if (seenExact[sig]) return
          seenExact[sig] = true
          exact.push({
            from: srcId, to: d.to,
            from_api: d.from_api || null, to_api: d.to_api || null,
            kind: d.kind, label: d.label || null, cross_tree: !!d.cross_tree,
            agg: false, count: 1, samples: [srcId + (d.from_api ? ' [' + d.from_api + ']' : '') + ' -> ' + d.to + (d.to_api ? ' [' + d.to_api + ']' : '')],
          })

        var hit = aggMap[key]

  /** 叶子框内最多展示几行 API：由该层渲染数据的 max_api_rows 控制（0 = 全部），缺省 0 = 全展开。 */

  function layoutBlock(members, edges, inner, maxCols) {
    var memberSet = {}
    members.forEach(function (id) { memberSet[id] = true })
    var internal = edges.filter(function (e) { return memberSet[e.from] && memberSet[e.to] })
    var nodes = []
    var W = 0, H = 0
    if (inner === 'column') {

  function renderDiagram(main, m, kids) {

          var gY = laneAt(rowOrder[ri3].y, 'fr', rowOrder[ri3].span)
          if (gY === null) continue
          var gxA = eA.laneX
          var gxB = eB.laneX
          var gpts = [{ x: pa.x, y: pa.y }]
          if (eA.row === null) gpts.push({ x: gxA, y: pa.y })
          else { gpts.push({ x: pa.x, y: eA.rowY }); gpts.push({ x: gxA, y: eA.rowY }) }
          gpts.push({ x: gxA, y: gY })
          gpts.push({ x: gxB, y: gY })
          if (eB.row === null) { gpts.push({ x: gxB, y: pb.y }); gpts.push({ x: pb.x, y: pb.y }) }
          else { gpts.push({ x: gxB, y: eB.rowY }); gpts.push({ x: pb.x, y: eB.rowY }); gpts.push({ x: pb.x, y: pb.y }) }
          cands2.push(gpts)
          built++
        }
      }
      var ordered = cands2.concat(cands)
      // 首选：任何一项违规都为 0 的候选（不穿别的框、不压已画的线、不横穿自己的框、端口法向正确）。
      // 旧实现只判 pathClear（不穿别人的框）就返回，于是"第一条不撞框的路径"可能是压着别的线走的。
      for (var oi = 0; oi < ordered.length; oi++) {
        var opts = clean(ordered[oi])
        if (pathClear(opts, e.from, e.to) && violations(opts) === 0) return { pts: opts, hint: hint, fallback: e.agg }
      }
      // 次选：没有完全干净的路径时，取违规最少的一条
      var bestV1 = Infinity, bestPts1 = null
      for (var oj = 0; oj < ordered.length; oj++) {
        var opj = clean(ordered[oj])
        if (!pathClear(opj, e.from, e.to)) continue
        var vj = violations(opj)
        if (vj < bestV1) { bestV1 = vj; bestPts1 = opj }
      }
      if (bestPts1 !== null) return { pts: bestPts1, hint: hint, fallback: true }
      function violations(pts) {
        var v = 0
        // 端口法向：T/B 端口的首段必须是竖直的，L/R 端口必须是水平的；
        // 否则线会沿着节点自己的边滑行，多条边叠在同一条边线上（线压线）。
        if (pts.length >= 2) {
          var f = pts[1]
          if ((pa.side === 'T' || pa.side === 'B') ? Math.abs(f.y - pa.y) < 0.6 : Math.abs(f.x - pa.x) < 0.6) v += 6
          var l = pts[pts.length - 2]
          if ((pb.side === 'T' || pb.side === 'B') ? Math.abs(l.y - pb.y) < 0.6 : Math.abs(l.x - pb.x) < 0.6) v += 6
        }
        for (var si = 0; si < pts.length - 1; si++) {
          for (var ri = 0; ri < rects.length; ri++) {
            var rn = nodes[ri]
            if (rn.id === e.from || rn.id === e.to) continue
            if (!segClear(pts[si].x, pts[si].y, pts[si + 1].x, pts[si + 1].y, e.from, e.to)) v += 8
          }
          if (segHugsGroup(pts[si].x, pts[si].y, pts[si + 1].x, pts[si + 1].y)) v += 2
          if (segOverlapsUsed(pts[si].x, pts[si].y, pts[si + 1].x, pts[si + 1].y)) v += 3
          // 端点框：segClear 会整块跳过源/目标框，若不额外检查，连线可以横穿自己的框
          var rA = rectById[e.from], rB = rectById[e.to]
          if (rA && segEntersRect(pts[si].x, pts[si].y, pts[si + 1].x, pts[si + 1].y, rA)) v += 4
          if (rB && segEntersRect(pts[si].x, pts[si].y, pts[si + 1].x, pts[si + 1].y, rB)) v += 4
        }
        return v
      }
      var bestPts = clean(ordered[ordered.length - 1]), bestV = Infinity
      for (var pi = 0; pi < ordered.length; pi++) {
        var cp = clean(ordered[pi])
        var v1 = violations(cp)
        if (v1 < bestV) { bestV = v1; bestPts = cp }
      }
      return { pts: bestPts, hint: hint, fallback: true }
    }
    function roundedPath(pts, r) {
      if (pts.length < 2) return ''
      var d = 'M ' + pts[0].x + ' ' + pts[0].y
      for (var i = 1; i < pts.length - 1; i++) {
        var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1]
        var d1 = Math.sqrt((p1.x - p0.x) * (p1.x - p0.x) + (p1.y - p0.y) * (p1.y - p0.y))
        var d2 = Math.sqrt((p2.x - p1.x) * (p2.x - p1.x) + (p2.y - p1.y) * (p2.y - p1.y))
        var rr = Math.min(r, d1 / 2 - 0.5, d2 / 2 - 0.5)
        if (rr < 3) { d += ' L ' + p1.x + ' ' + p1.y; continue }
        var ax = p1.x - (p1.x - p0.x) * rr / d1
        var ay = p1.y - (p1.y - p0.y) * rr / d1
        var bx = p1.x + (p2.x - p1.x) * rr / d2
        var by = p1.y + (p2.y - p1.y) * rr / d2
        d += ' L ' + ax + ' ' + ay + ' Q ' + p1.x + ' ' + p1.y + ' ' + bx + ' ' + by
      }
      var last = pts[pts.length - 1]
      d += ' L ' + last.x + ' ' + last.y
      return d
    }
    function arrowPoints(tip, prev) {
      var dx = tip.x - prev.x, dy = tip.y - prev.y
      var len = Math.sqrt(dx * dx + dy * dy) || 1
      var c = dx / len, s = dy / len
      var bx = tip.x - 9 * c, by = tip.y - 9 * s
      var px = -s * 4.5, py = c * 4.5
      return tip.x + ',' + tip.y + ' ' + (bx + px) + ',' + (by + py) + ' ' + (bx - px) + ',' + (by - py)
    }

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    svg.setAttribute('class', 'diagram')
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet')

    blocks.forEach(function (b) {
      if (!b.title) return
      var bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      bg.setAttribute('x', b.offsetX - GPAD)
      bg.setAttribute('y', b.offsetY - GTITLE - GPAD + 6)
      bg.setAttribute('width', b.w + GPAD * 2)
      bg.setAttribute('height', b.h + GTITLE + GPAD * 2 - 6)
      bg.setAttribute('rx', 12)
      bg.setAttribute('class', 'group-box')
      svg.appendChild(bg)
      var gt = document.createElementNS('http://www.w3.org/2000/svg', 'text')
      gt.setAttribute('x', b.offsetX - GPAD + 4)
      gt.setAttribute('y', b.offsetY - 10)
      gt.setAttribute('class', 'group-title')
      gt.textContent = L(b.title)
      svg.appendChild(gt)
    })

    var drawn = []
    var labelBudget = {}
    var placedLabels = []
    var bounds = { minX: 0, minY: 0, maxX: W, maxY: H }
    function extend(x, y) {
      if (typeof x !== 'number' || typeof y !== 'number' || !isFinite(x) || !isFinite(y)) return
      if (x < bounds.minX) bounds.minX = x
      if (y < bounds.minY) bounds.minY = y
      if (x > bounds.maxX) bounds.maxX = x
      if (y > bounds.maxY) bounds.maxY = y
    }
    function labelPos(pts, text, skipFrom, skipTo) {
      var w = estWidth(text, 10)
      var best = null, bestLen = -1
      for (var i = 0; i < pts.length - 1; i++) {
        var p0 = pts[i], p1 = pts[i + 1]
        var dx = p1.x - p0.x, dy = p1.y - p0.y
        var len = Math.sqrt(dx * dx + dy * dy)
        if (len < 30) continue
        var horiz = Math.abs(dx) > Math.abs(dy)
        var mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2
        var lx = mx - w / 2 - 4, ly = horiz ? my - 14 : my - 5, lw = w + 8, lh = 12
        var ok = true
        for (var r = 0; r < rects.length; r++) {
          var n = nodes[r]
          if (n.id === skipFrom || n.id === skipTo) continue
          var b2 = rects[r]
          if (lx + lw > b2.x + 3 && lx < b2.x + b2.w - 3 && ly + lh > b2.y + 3 && ly < b2.y + b2.h - 3) { ok = false; break }
        }
        for (var pl = 0; pl < placedLabels.length; pl++) {
          var b3 = placedLabels[pl]
          if (lx + lw > b3.x && lx < b3.x + b3.w && ly + lh > b3.y && ly < b3.y + b3.h) { ok = false; break }
        }
        if (ok && len > bestLen) { bestLen = len; best = { x: mx, y: horiz ? my - 9 : my, len: len, rect: { x: lx, y: ly, w: lw, h: lh } } }
      }
      if (best !== null && best.rect !== undefined) placedLabels.push(best.rect)
      return best
    }
    function drawEdge(e, pa, pb, r) {
      var pts = r.pts
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
      path.setAttribute('d', roundedPath(pts, (r.hint && r.hint.style === 'curve') || e.agg ? 16 : 10))
      path.setAttribute('class', 'edge kind-' + (e.kind || 'reference') + (e.cross_tree ? ' cross' : '') + (e.agg ? ' agg' : ''))
      path.setAttribute('data-from', e.from)
      path.setAttribute('data-to', e.to)
      var tip = pts[pts.length - 1], prev = pts[pts.length - 2] || pa
      var entry = { path: path, arrow: mk, label: null, from: e.from, to: e.to }
      var title = document.createElementNS('http://www.w3.org/2000/svg', 'title')
      title.textContent = e.agg
        ? '聚合 ' + e.count + ' 条依赖：\n' + e.samples.join('\n')
        : e.from + (e.from_api ? ' [' + e.from_api + ']' : '') + ' -> ' + e.to + (e.to_api ? ' [' + e.to_api + ']' : '') + ' (' + e.kind + ')'
      path.appendChild(title)
      svg.appendChild(path)
      var mk = document.createElementNS('http://www.w3.org/2000/svg', 'polygon')
      mk.setAttribute('points', arrowPoints(tip, prev))
      mk.setAttribute('class', 'arrow kind-' + (e.kind || 'reference') + (e.cross_tree ? ' cross' : '') + (e.agg ? ' agg' : ''))
      svg.appendChild(mk)
      var text = e.agg ? ('×' + e.count) : (e.label ? L(e.label) : e.kind)
      var budget = labelBudget[text] || 0
      var lp = budget < 2 ? labelPos(pts, text, e.from, e.to) : null
      if (lp) {
        labelBudget[text] = budget + 1
        var t = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        t.setAttribute('x', lp.x)
        t.setAttribute('y', lp.y)
        t.setAttribute('text-anchor', 'middle')
        t.setAttribute('class', 'edge-label' + (e.agg ? ' agg' : ''))
        t.setAttribute('style', 'paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round;')
        t.textContent = text
        svg.appendChild(t)
        entry.label = t
        extend(lp.x - 30, lp.y - 10)
        extend(lp.x + 30, lp.y + 12)
      }
      for (var i = 0; i < pts.length; i++) extend(pts[i].x, pts[i].y)
      commitRoute(pts)
      drawn.push(entry)
    }

    // 先画精确边（API 直连，优先占用干净通道），再画聚合边（虚线、更轻）
    exactEdges.forEach(function (e) {
      var A = byId[e.from], B = byId[e.to]
      if (!A || !B) return
      var pa = portOf(A, e.sides[0], e.from + e.sides[0], e.from_api)
      var pb = portOf(B, e.sides[1], e.to + e.sides[1], e.to_api)
      drawEdge(e, pa, pb, route(e, pa, pb))
    })
    aggEdges.forEach(function (e) {
      var A = byId[e.from], B = byId[e.to]
      if (!A || !B) return
      var pa = portOf(A, e.sides[0], e.from + e.sides[0], null)
      var pb = portOf(B, e.sides[1], e.to + e.sides[1], null)
      drawEdge(e, pa, pb, route(e, pa, pb))
    })

    var nodeGroups = []
    nodes.forEach(function (n) {
      var km = mods[n.id]
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      g.setAttribute('class', 'node-g')
      g.setAttribute('data-id', n.id)
      var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      rect.setAttribute('x', n.x); rect.setAttribute('y', n.y)
      rect.setAttribute('width', n.w); rect.setAttribute('height', n.h)
      rect.setAttribute('rx', 9)
      rect.setAttribute('data-id', n.id)
      rect.setAttribute('class', 'node' + (children[n.id] ? '' : ' leaf') + (km.state ? ' state-' + km.state : ''))
      g.appendChild(rect)
      var rows = apiRows(n.id)
      var nameH = rows.length > 0 ? 36 : n.h
      var fit = fitName(L(km.name), n.w - 14)
      var lh = fit.fs * 1.28
      var y0 = n.y + nameH / 2 - (fit.lines.length - 1) * lh / 2
      for (var li = 0; li < fit.lines.length; li++) {
        var t = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        t.setAttribute('x', n.cx)
        t.setAttribute('y', y0 + li * lh)
        t.setAttribute('font-size', fit.fs)
        t.setAttribute('text-anchor', 'middle')
        t.setAttribute('dominant-baseline', 'middle')
        t.setAttribute('class', 'node-name')
        t.textContent = fit.lines[li]
        g.appendChild(t)
      }
      if (rows.length > 0) {
        var sep = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        sep.setAttribute('x1', n.x + 8); sep.setAttribute('x2', n.x + n.w - 8)
        sep.setAttribute('y1', n.y + 36); sep.setAttribute('y2', n.y + 36)
        sep.setAttribute('class', 'api-sep')
        g.appendChild(sep)
        rows.forEach(function (a, ai) {
          var at = document.createElementNS('http://www.w3.org/2000/svg', 'text')
          at.setAttribute('x', n.x + 9)
          at.setAttribute('y', n.y + 36 + ai * 13 + 9)
          at.setAttribute('class', 'api-chip')
          at.textContent = clipText(String(a.key || a.protocol + ':' + a.path), n.w - 24, 9)
          g.appendChild(at)
        })
        var total = (km.apis || []).length
        if (total > rows.length) {
          var more = document.createElementNS('http://www.w3.org/2000/svg', 'text')
          more.setAttribute('x', n.x + n.w - 9)
          more.setAttribute('y', n.y + n.h - 4)
          more.setAttribute('text-anchor', 'end')
          more.setAttribute('class', 'api-more')
          more.textContent = '+' + (total - rows.length)
          g.appendChild(more)
        }
      }
      if (km.state === 'planned' || km.state === 'deprecated') {
        var badge = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        badge.setAttribute('x', n.x + n.w - 6)
        badge.setAttribute('y', n.y + 12)
        badge.setAttribute('text-anchor', 'end')
        badge.setAttribute('class', 'state-badge state-' + km.state)
        badge.textContent = km.state === 'planned' ? (lang === 'zh' ? '计划' : 'planned') : (lang === 'zh' ? '废弃' : 'deprecated')
        g.appendChild(badge)
      }
      g.onclick = function () { goto('#module=' + encodeURIComponent(n.id)) }
      g.onmouseenter = function () {
        showTip(g, km)
        drawn.forEach(function (d) {
          var hit = d.from === n.id || d.to === n.id
          ;[d.path, d.arrow].forEach(function (el2) { el2.classList.toggle('hl', hit); el2.classList.toggle('dim', !hit) })
          if (d.label) d.label.classList.toggle('dim', !hit)
        })
      }
      g.onmouseleave = function () {
        hideTip()
        drawn.forEach(function (d) {
          ;[d.path, d.arrow].forEach(function (el2) { el2.classList.remove('hl'); el2.classList.remove('dim') })
          if (d.label) d.label.classList.remove('dim')
        })
      }
      svg.appendChild(g)
      nodeGroups.push(g)
      extend(n.x, n.y)
      extend(n.x + n.w, n.y + n.h)
    })

    var PADB = 28
    var vbW = Math.max(320, bounds.maxX - bounds.minX + PADB * 2)
    var vbH = Math.max(240, bounds.maxY - bounds.minY + PADB * 2)
    svg.setAttribute('viewBox', (bounds.minX - PADB) + ' ' + (bounds.minY - PADB) + ' ' + vbW + ' ' + vbH)
    svg.setAttribute('width', vbW)
    svg.setAttribute('height', vbH)

    var wrap = el('div', 'diagram-wrap')
    wrap.appendChild(svg)
    main.appendChild(wrap)

    var zoomSteps = [0, 1, 1.5, 2, 3]
    var zi = (vbW > wrap.clientWidth + 20) ? 1 : 0
    var ziLabel = el('span', 'zoom-label')
    function applyZoom() {
      var s = zoomSteps[zi]
      if (s === 0) { svg.style.width = '100%'; svg.style.maxWidth = '100%' } else { svg.style.width = Math.round(vbW * s) + 'px'; svg.style.maxWidth = 'none' }
      svg.style.height = 'auto'
      ziLabel.textContent = s === 0 ? (lang === 'zh' ? '适应' : 'Fit') : Math.round(s * 100) + '%'
    }
    var tools = el('div', 'diagram-tools')
    var minus = el('button', 'zoom-btn', '−')
    minus.onclick = function () { zi = Math.max(0, zi - 1); applyZoom() }
    var fitBtn = el('button', 'zoom-btn', lang === 'zh' ? '适应' : 'Fit')
    fitBtn.onclick = function () { zi = 0; applyZoom() }
    var plus = el('button', 'zoom-btn', '+')
    plus.onclick = function () { zi = Math.min(zoomSteps.length - 1, zi + 1); applyZoom() }
    tools.appendChild(minus); tools.appendChild(fitBtn); tools.appendChild(plus); tools.appendChild(ziLabel)
    if (aggEdges.length > 0) {
      var aggBtn = el('button', 'zoom-btn' + ' agg-toggle', (lang === 'zh' ? '显示跨层聚合 ×' + aggEdges.length : 'Show ' + aggEdges.length + ' cross-level')) 
      aggBtn.onclick = function () {
        var hidden = svg.classList.toggle('hide-agg')
        aggBtn.classList.toggle('on', !hidden)
      }
      if (!/[?&]agg=1/.test(location.search)) svg.classList.add('hide-agg')
      tools.appendChild(aggBtn)
      var aggInfo = el('span', 'hint', lang === 'zh' ? '（虚线 = 跨层聚合 ×N，默认隐藏，可点左侧按钮显示；悬停看明细）' : '(dashed = cross-level aggregate; hidden by default)')
      tools.appendChild(aggInfo)
    }
    main.appendChild(tools)
    applyZoom()

    var bar = el('div', 'legendbar')
    bar.innerHTML = '<span class="hint">连线：</span>'
      + '<span class="chip"><span class="swatch kind-call"></span>call</span>'
      + '<span class="chip"><span class="swatch kind-event"></span>event</span>'
      + '<span class="chip"><span class="swatch kind-dataflow"></span>dataflow</span>'
      + '<span class="chip"><span class="swatch kind-reference"></span>reference</span>'
      + '<span class="chip"><span class="swatch cross"></span>跨树</span>'
      + '<span class="chip"><span class="swatch agg"></span>' + esc(lang === 'zh' ? '跨层聚合' : 'aggregate') + '</span>'
      + '<span class="chip">' + esc(lang === 'zh' ? '悬停模块可高亮其连线；虚线边悬停可看明细' : 'Hover a module to highlight its edges; hover dashed edges for details') + '</span>'
      + '<span class="chip"><span class="swatch" style="border-color: var(--accent); border-top-style: dashed"></span>' + esc(lang === 'zh' ? '计划态' : 'planned') + '</span>'
      + '<span class="chip"><span class="swatch" style="border-color: var(--danger); border-top-style: dotted"></span>' + esc(lang === 'zh' ? '已废弃' : 'deprecated') + '</span>'
    main.appendChild(bar)
  }

  /** 文本截断（保持单行，超长加省略号）。 */
  function clipText(s, maxW, fs) {
    var t = String(s)
    if (estWidth(t, fs) <= maxW) return t
    while (t.length > 1 && estWidth(t + '…', fs) > maxW) t = t.slice(0, -1)
    return t + '…'
  }

  function renderCrossEdges(main, m, kids) {
    var kidsSet = {}
    kids.forEach(function (id) { kidsSet[id] = true })
    var outs = [], ins = []
    kids.forEach(function (id) {
      var km = mods[id]
      ;(km.deps || []).forEach(function (d) {
        if (!kidsSet[d.to]) outs.push({ from: id, dep: d })
      })
      ;(depIn[id] || []).forEach(function (e) {
        if (!kidsSet[e.from]) ins.push({ to: id, edge: e })
      })
    })
    var box = el('div', 'crosslist')
    box.appendChild(el('h3', null, '跨层箭头'))
    if (outs.length === 0 && ins.length === 0) {
      box.appendChild(el('div', 'hint', '本层没有指向外部或来自外部的箭头'))
    }
    outs.forEach(function (o) {
      var row = el('div', 'row')
      row.innerHTML = esc(o.from) + ' → ' + linkTo(o.dep.to)
        + ' <span class="hint">(' + esc(o.dep.kind) + (o.dep.label ? ' · ' + esc(L(o.dep.label)) : '') + ')</span>'
        + (o.dep.cross_tree ? '<span class="badge">跨树</span>' : '')
      box.appendChild(row)
    })
    ins.forEach(function (o) {
      var row = el('div', 'row')
      row.innerHTML = esc(o.to) + ' ← ' + linkTo(o.edge.from)
        + ' <span class="hint">(' + esc(o.edge.kind) + (o.edge.label ? ' · ' + esc(L(o.edge.label)) : '') + ')</span>'
        + (o.edge.cross_tree ? '<span class="badge">跨树</span>' : '')
      box.appendChild(row)
    })
    main.appendChild(box)
  }

  function renderInheritedApis(main, m) {
    var kids = children[m.id] || []
    var total = m.aggregate.own_api_count + m.aggregate.inherited_api_count
    var box = el('div', 'section')
    box.appendChild(el('h2', null, 'API（' + total + '）'))
    if (total === 0) { box.appendChild(el('div', 'hint', '本模块及其子树未定义 API')); main.appendChild(box); return }
    var list = el('ul', 'api-list')
    if (m.apis && m.apis.length > 0) {
      m.apis.forEach(function (a) { list.appendChild(apiItem(a)) })
    }
    box.appendChild(list)
    kids.forEach(function (id) {
      box.appendChild(apiGroup(id, 0))
    })
    main.appendChild(box)
  }

  function apiGroup(id, depth) {
    var km = mods[id]
    var own = (km.apis || []).length
    var below = km.aggregate.inherited_api_count
    var total = own + below
    var det = document.createElement('details')
    det.className = 'api-group'
    if (depth === 0) det.setAttribute('open', '')
    var sum = document.createElement('summary')
    sum.innerHTML = esc(L(km.name)) + ' <span class="cnt">' + esc(id) + ' · ' + total + '</span>'
    det.appendChild(sum)
    var inner = document.createElement('div')
    var ul = document.createElement('ul')
    ul.className = 'api-list'
    ;(km.apis || []).forEach(function (a) { ul.appendChild(apiItem(a)) })
    inner.appendChild(ul)
    var kids = children[id] || []
    kids.forEach(function (cid) { inner.appendChild(apiGroup(cid, depth + 1)) })
    det.appendChild(inner)
    return det
  }

  function apiItem(a) {
    var li = document.createElement('li')
    li.innerHTML = '<span class="key">' + esc(a.key || a.protocol + ':' + a.path) + '</span>'
      + '<span class="desc">' + esc(L(a.description)) + '</span>'
    return li
  }

  function renderLeafDetail(main, m) {
    var box = el('div', 'section')
    box.appendChild(el('h2', null, 'API（' + (m.apis || []).length + '）'))
    if (!m.apis || m.apis.length === 0) box.appendChild(el('div', 'hint', '该叶子模块未定义 API（无接口的功能单元）'))
    else {
      var ul = el('ul', 'api-list')
      m.apis.forEach(function (a) { ul.appendChild(apiItem(a)) })
      box.appendChild(ul)
    }
    var outs = m.deps || []
    box.appendChild(el('h3', null, '出向箭头（' + outs.length + '）'))
    outs.forEach(function (d) {
      var row = el('div', 'row')
      row.innerHTML = '→ ' + linkTo(d.to) + ' <span class="hint">(' + esc(d.kind) + (d.label ? ' · ' + esc(L(d.label)) : '') + ')</span>' + (d.cross_tree ? '<span class="badge">跨树</span>' : '')
      box.appendChild(row)
    })
    var ins = depIn[m.id] || []
    box.appendChild(el('h3', null, '入向箭头（' + ins.length + '）'))
    ins.forEach(function (e) {
      var row = el('div', 'row')
      row.innerHTML = '← ' + linkTo(e.from) + ' <span class="hint">(' + esc(e.kind) + (e.label ? ' · ' + esc(L(e.label)) : '') + ')</span>' + (e.cross_tree ? '<span class="badge">跨树</span>' : '')
      box.appendChild(row)
    })
    main.appendChild(box)
  }

  function renderOutline(main) {
    var box = el('div', 'section')
    box.appendChild(el('h2', null, '大纲（' + roots.length + ' 棵树 · ' + stats.module_count + ' 模块）'))
    var wrap = el('div', 'outline')
    var ul = document.createElement('ul')
    roots.forEach(function (id) { ul.appendChild(outlineItem(id)) })
    wrap.appendChild(ul)
    box.appendChild(wrap)
    main.appendChild(box)
  }

  function outlineItem(id) {
    var m = mods[id]
    var li = document.createElement('li')
    var a = document.createElement('a')
    a.href = '#module=' + encodeURIComponent(id)
    a.textContent = L(m.name) + ' — ' + id
    li.appendChild(a)
    li.appendChild(document.createTextNode(' '))
    var s = document.createElement('span')
    s.className = 'stat'
    s.textContent = '[模块 ' + (m.aggregate.descendant_count + 1) + ' · API ' + (m.aggregate.own_api_count + m.aggregate.inherited_api_count) + ']'
    li.appendChild(s)
    var kids = children[id] || []
    if (kids.length > 0) {
      var ul = document.createElement('ul')
      kids.forEach(function (k) { ul.appendChild(outlineItem(k)) })
      li.appendChild(ul)
    }
    return li
  }

  function renderApis(main) {
    var box = el('div', 'section')
    box.appendChild(el('h2', null, 'API 浏览器（' + Object.keys(apiIndex).length + '）'))
    var input = document.createElement('input')
    input.id = 'apiFilter'
    input.placeholder = '过滤（method / path / protocol）'
    input.style.cssText = 'width:100%;padding:6px 8px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;margin-bottom:8px;'
    box.appendChild(input)
    var table = document.createElement('table')
    var keys = Object.keys(apiIndex).sort()
    var MAX = 400
    function draw(filter) {
      table.innerHTML = '<tr><th>API</th><th>归属模块</th></tr>'
      var shown = 0
      for (var i = 0; i < keys.length && shown < MAX; i++) {
        var k = keys[i]
        if (filter && k.toLowerCase().indexOf(filter) === -1 && mods[apiIndex[k]].id.toLowerCase().indexOf(filter) === -1) continue
        var tr = document.createElement('tr')
        var td1 = document.createElement('td')
        var a1 = document.createElement('a')
        a1.href = '#api=' + encodeURIComponent(k)
        a1.textContent = k
        td1.appendChild(a1)
        var td2 = document.createElement('td')
        var a2 = document.createElement('a')
        a2.href = '#module=' + encodeURIComponent(apiIndex[k])
        a2.textContent = apiIndex[k]
        td2.appendChild(a2)
        tr.appendChild(td1); tr.appendChild(td2)
        table.appendChild(tr)
        shown++
      }
      if (shown >= MAX) {
        var tr = document.createElement('tr')
        var td = document.createElement('td')
        td.colSpan = 2
        td.className = 'hint'
        td.textContent = '已显示前 ' + MAX + ' 条，请用过滤缩小范围'
        tr.appendChild(td)
        table.appendChild(tr)
      }
    }
    draw('')
    input.oninput = function () { draw(input.value.trim().toLowerCase()) }
    box.appendChild(table)
    main.appendChild(box)
  }

  function highlightApi() {
    var key = current.apiKey
    var nodes = document.querySelectorAll('.key')
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].textContent === key) {
        nodes[i].scrollIntoView({ block: 'center' })
        nodes[i].style.outline = '2px solid var(--accent)'
      }
    }
  }

  function linkTo(id) {
    return '<a href="#module=' + encodeURIComponent(id) + '">' + esc(id) + '</a>'
  }
  function oneLine(s, max) { var l = (s || '').split('\n')[0]; return l.length > max ? l.slice(0, max) + '…' : l }
  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; return d }

  var tip = document.getElementById('tooltip')
  var tipTimer = null
  function showTip(anchor, m) {
    tipTimer = setTimeout(function () {
      tip.innerHTML = '<div class="t-name">' + esc(L(m.name)) + ' <span class="hint">' + esc(m.id) + '</span></div>'
        + '<div class="t-desc">' + esc(L(m.description)) + '</div>'
        + '<div class="t-meta">' + (m.state ? (m.state === 'planned' ? '计划态 · ' : m.state === 'deprecated' ? '已废弃 · ' : '') : '') + '模块 ' + (m.aggregate.descendant_count + 1) + ' · API ' + (m.aggregate.own_api_count + m.aggregate.inherited_api_count) + '</div>'
      tip.style.display = 'block'
    }, 250)
    document.addEventListener('mousemove', moveTip)
    var r = anchor.getBoundingClientRect()
    moveTip({ clientX: r.right + 8, clientY: r.top })
  }
  function moveTip(e) {
    var pad = 12
    var w = tip.offsetWidth || 280
    var x = Math.min(e.clientX + pad, window.innerWidth - w - 8)
    var y = e.clientY + pad
    if (y + 120 > window.innerHeight) y = e.clientY - 140
    tip.style.left = x + 'px'
    tip.style.top = y + 'px'
  }
  function hideTip() {
    clearTimeout(tipTimer)
    tip.style.display = 'none'
    document.removeEventListener('mousemove', moveTip)
  }

  var input = document.getElementById('searchInput')
  var drop = document.getElementById('searchDrop')
  var searchTimer = null
  input.addEventListener('input', function () {
    clearTimeout(searchTimer)
    searchTimer = setTimeout(function () {
      var q = input.value.trim().toLowerCase()
      drop.innerHTML = ''
      if (!q) { drop.classList.remove('open'); return }
      var hits = []
      for (var i = 0; i < corpus.length && hits.length < 20; i++) {
        if (corpus[i].text.indexOf(q) >= 0) hits.push(corpus[i])
      }
      hits.forEach(function (h) {
        var item = el('div', 'item')
        if (h.kind === 'module') {
          item.innerHTML = esc(h.id) + '<div class="sub">模块</div>'
          item.onclick = function () { input.value = ''; drop.classList.remove('open'); goto('#module=' + encodeURIComponent(h.id)) }
        } else {
          item.innerHTML = esc(h.id) + '<div class="sub">API · ' + esc(h.moduleId) + '</div>'
          item.onclick = function () { input.value = ''; drop.classList.remove('open'); goto('#api=' + encodeURIComponent(h.id)) }
        }
        drop.appendChild(item)
      })
      drop.classList.add('open')
    }, 150)
  })
  document.addEventListener('click', function (e) {
    if (e.target !== input && e.target !== drop) drop.classList.remove('open')
  })

  document.getElementById('btnLang').addEventListener('click', function () {
    lang = lang === 'zh' ? 'en' : 'zh'
    try { localStorage.setItem('normify-lang', lang) } catch (e) {}
    render()
  })
  document.getElementById('btnTheme').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
    document.documentElement.setAttribute('data-theme', t)
    try { localStorage.setItem('normify-theme', t) } catch (e) {}
  })
  document.getElementById('btnOutline').addEventListener('click', function () { goto('#view=outline') })
  document.getElementById('btnApis').addEventListener('click', function () { goto('#view=apis') })
  window.addEventListener('hashchange', function () { current = parseHash(); render() })

  initTheme()
  render()
})()
</script>
</body>
</html>
