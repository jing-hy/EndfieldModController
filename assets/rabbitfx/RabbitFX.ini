namespace = RabbitFX
; RabbitFX -Arknights Endfield- Version 2.6

; Support Caverabbit at https://www.patreon.com/Caverabbit

; Decensor Keybinding ----------------------------------

[KeyCensor]
key = no_modifiers \
type = cycle
$censor = 0,1

; General ----------------------------------------------

[Constants]
global $h = 0.0
global $s = 0.0
global $v = 0.0
global $brightness = 1.0
global $interpolate = 1.0

global persist $censor = 0
global $RabbitFXMain = 1718.1
global $RabbitFXShadow = 1718.2
global $RabbitFXShadowFace = 1718.3

[Present]

; Set Textures -----------------------------------------

[ResourceDiffuse]
[ResourceLightmap]
[ResourceNormalmap]
[ResourceDiscardMap]
[ResourceRainmap]

[CommandListSetTextures]
if (ps == $RabbitFXMain || ps == $RabbitFXShadow) && DRAW_TYPE == 4

	ps-t70 = ref ResourceDiffuse
	ps-t71 = ref ResourceLightmap
	ps-t72 = ref ResourceNormalmap
	ps-t73 = ref ResourceDiscardMap
	ps-t74 = ref ResourceRainmap

endif

ResourceDiffuse = null
ResourceLightmap = null
ResourceNormalmap = null
ResourceDiscardMap = null
ResourceRainmap = null

; RabbitFX ---------------------------------------------

[ResourceGlowMap]
[ResourceFXMap]

[CommandListRun]
if (ps == $RabbitFXMain || ps == $RabbitFXShadow) && DRAW_TYPE == 4

	ps-t60 = ref ResourceGlowMap
	ps-t61 = ref ResourceFXMap

endif

ResourceGlowMap = null
ResourceFXMap = null

x217 = ($h / 360.0) * $interpolate
y217 = ($s / 100.0) * $interpolate
z217 = ($v / 100.0) * $interpolate
w217 = $brightness
x172 = 1

$h = 0.0
$s = 0.0
$v = 0.0
$brightness = 1.0
$interpolate = 1.0

[CommandListClean]
ps-t60 = null
ps-t61 = null
ps-t70 = null
ps-t71 = null
ps-t72 = null
ps-t73 = null
ps-t74 = null

x217 = 0
y217 = 0
z217 = 0
w217 = 0
x172 = 0

; Debug ------------------------------------------------

; [ShaderOverrideDebug]
; hash = cd4ed6440f0bfcf0
; filter_index = 1718.1
; Resource\Debug_cb\cb = ps-cb0

; [TextureOverrideDebugIBFIlter]
; hash = 651f4fd5
; if ps = 1718.1
; Resource\Debug_cb\cb = ps-cb0

; Main -------------------------------------------------

[ShaderRegexMain]
shader_model = ps_4_0 ps_5_0
temps = TSRReg0 TSRReg1 TSRReg2 ini treg0 treg1 treg2 treg3 mask tmask shift color override tcoord
filter_index = 1718.1

w172 = $censor

post run = CommandListClean

[ShaderRegexMain.Pattern]
(?<header>dcl_constantbuffer\hCB0\[45\].+\ndcl_constantbuffer\hCB1\[\d{3}\].+\ndcl_constantbuffer\hCB2\[40\d{2}\].+\ndcl_constantbuffer\hCB3\[\d\].+\ndcl_constantbuffer\hCB4\[20\d{2}\].+\ndcl_constantbuffer\hCB5\[\d{3}\].+\ndcl_constantbuffer\hCB6\[\d{2}\].+\n(?<cb7>dcl_constantbuffer\hCB7)?(?(cb7)\[\d{3}\].+\n)(?:dcl.*\n)*?dcl_resource_texture2d.+t\d{2}\n(?:dcl.*\n)*?dcl_output\ho0\.xyzw\ndcl_output\ho1\.xyzw\ndcl_temps.*\n)(?<func>(?<funcmain>(?:.*\n)*?max\hr\d+\.\w,\hcb\d+\[.+?\]\.\w,\hcb\d+\[.+?\]\.\w\nadd.+\n(?:.*\n)*?)(?<discard>discard.+\n))?(?<head>(?:.*\n)*?)(?<diffuse>(?<diffusehead>sample\w+\(texture2d\)\((?:float,?){4}\)\hr\d+\.\w+,\h(?<texcoordreg>\w\d+\.\w+),\h)t\d+(?<diffusetail>\.\w+,.+\n))(?:(?<lightmapsplit>(?:mul.*\n)*?)(?<lightmap>(?<lightmaphead>sample\w+\(texture2d\)\((?:float,?){4}\)\hr\d+\.\w+,\hv\d+\.\w+,\h)t\d+(?<lightmaptail>\.\w+,.+\n)))?(?<split>(?:.*\n){1,20}?(?=sample_b))?(?<normalmap>(?<normalmaphead>sample\w+\(texture2d\)\((?:float,?){4}\)\hr\d+\.\w+,\hv\d+\.\w+,\h)t\d+(?<normalmaptail>\.\w+,.+\n))?(?<rainmap>(?<rainsplit>(?:.*\n)*?)(?<rainmapr>(?<rainmaprhead>\h+sample_b.+?)t\d+(?<rainmaprtail>.*\n))(?<multichannelrain>(?<rainmapg>(?<rainmapghead>\h+sample_b.+?)t\d+(?<rainmapgtail>.*\n))(?<bluesplit>(?:.*\n)*?)(?<rainmapb>(?<rainmapbhead>\h+sample_b.+?)t\d+(?<rainmapbtail>.*\n)))?(?<endif>(?:.*\n)*?endif\n))?(?(normalmap)|(?<normalmap2>(?<normalmap2head>sample\w+\(texture2d\)\((?:float,?){4}\)\hr\d+\.\w+,\hv\d+\.\w+,\h)t\d+(?<normalmap2tail>\.\w+,.+\n))?)(?<body>(?:.*\n)*?)(?<output>(?<outputhead>\h*\w+\h)o0(?<outputtail>\.xyz.*\n))(?<elseoutput>(?<outputsplit>(?:.*\n)*?)(?<auxoutput>(?<auxoutputhead>\h*\w+\h)o0(?<auxoutputtail>\.xyz.*\n)))?

[ShaderRegexMain.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120
dcl_resource_texture2d (float,float,float,float) t60
dcl_resource_texture2d (float,float,float,float) t61
dcl_resource_texture2d (float,float,float,float) t70
dcl_resource_texture2d (float,float,float,float) t71
dcl_resource_texture2d (float,float,float,float) t72
dcl_resource_texture2d (float,float,float,float) t74

[ShaderRegexMain.Pattern.Replace]
${header}

; Debug
; discard_nz l(1)\n

${func:+

	${funcmain}

	ld_indexable(texture1d)(float,float,float,float) ${ini}.xyzw, l(172, 0), t120.xyzw\n
	if_z ${ini}.w\n

		${discard}

	endif\n

}

${head}

resinfo_indexable(texture2d)(float,float,float,float) ${TSRReg0}.xyyy, l(0), t70.xyzw\n
add ${TSRReg1}.x, ${TSRReg0}.x, ${TSRReg0}.y\n
resinfo_indexable(texture2d)(float,float,float,float) ${TSRReg0}.xyyy, l(0), t71.xyzw\n
add ${TSRReg1}.y, ${TSRReg0}.x, ${TSRReg0}.y\n
resinfo_indexable(texture2d)(float,float,float,float) ${TSRReg0}.xyyy, l(0), t72.xyzw\n
add ${TSRReg1}.z, ${TSRReg0}.x, ${TSRReg0}.y\n
resinfo_indexable(texture2d)(float,float,float,float) ${TSRReg0}.xyyy, l(0), t74.xyzw\n
add ${TSRReg1}.w, ${TSRReg0}.x, ${TSRReg0}.y\n

mov ${tcoord}.xyzw, ${texcoordreg}\n

if_nz ${TSRReg1}.x\n
	${diffusehead}t70${diffusetail}
else\n
	${diffuse}
endif\n

ld_indexable(texture1d)(float,float,float,float) ${ini}.xyzw, l(172, 0), t120.xyzw\n
mov ${override}.x, l(0)\n

if_nz ${ini}.x\n

; Cutout

	resinfo_indexable(texture2d)(float,float,float,float) ${treg0}.xyyy, l(0), t61.xyzw\n
	add ${treg1}.x, ${treg0}.x, ${treg0}.y\n
	if_nz ${treg1}.x\n
		mul ${treg0}.xyyy, ${treg0}.xyyy, ${tcoord}.xyyy%1\n
		mov ${treg0}.zw, l(0,0)\n
		ftoi ${treg0}.xyyy, ${treg0}.xyyy\n
		ld_aoffimmi_indexable(1,1,1)(texture2d)(float,float,float,float) ${tmask}.xyzw, ${treg0}.xy, t61.xyzw\n

; Fallback to sample if load fails
		if_z ${tmask}.w\n
			sample_indexable(texture2d)(float,float,float,float) ${tmask}.xyzw, ${tcoord}.xy, t61.xyzw, s0\n
		endif\n

		lt ${treg0}.x, ${tmask}.w, l(1.0)\n
		if_nz ${treg0}.x\n
			discard_z l(0)\n
		endif\n
	endif\n

; Glow

	resinfo_indexable(texture2d)(float,float,float,float) ${treg0}.xyzw, l(0), t60.xyzw\n
	add ${treg1}.x, ${treg0}.x, ${treg0}.y\n
	if_nz ${treg1}.x\n
		mul ${treg0}.xyyy, ${treg0}.xyyy, ${tcoord}.xyyy%1\n
		mov ${treg0}.zw, l(0,0)\n
		ftoi ${treg0}.xyyy, ${treg0}.xyyy\n
		ld_aoffimmi_indexable(1,1,1)(texture2d)(float,float,float,float) ${color}.xyzw, ${treg0}.xy, t60.xyzw\n 
		ld_indexable(texture1d)(float,float,float,float) ${shift}.xyzw, l(217, 0), t120.xyzw\n
	
		; Fallback to sample if load fails
		dp4 ${treg1}.x, ${color}.xyzw, ${color}.xyzw\n
		if_z ${treg1}.x\n
			sample_indexable(texture2d)(float,float,float,float) ${color}.xyzw, ${tcoord}.xy, t60.xyzw, s0\n
		endif\n

		if_nz ${color}.w\n
			mov ${override}.x, l(1)\n
	; Hue Shift
			mov ${treg0}.zw, l(0,0,-1.000000,0.666667)\n
			mov ${treg1}.zw, l(0,0,0,-0.333333)\n
			mov ${treg2}.xyzw, ${color}.xyzx\n
			mov ${treg0}.xy, ${treg2}.zyzz\n
			mov ${treg1}.xy, ${treg0}.yxyy\n
			lt ${treg2}.y, ${treg0}.y, ${treg2}.z\n
			movc ${treg0}.xyzw, ${treg2}.yyyy, ${treg0}.xyzw, ${treg1}.xyzw\n
			lt ${treg1}.x, ${treg2}.x, ${treg0}.x\n
			mov ${treg3}.xyz, ${treg0}.xywx\n
			mov ${treg3}.w, ${treg2}.x\n
			mov ${treg0}.xyw, ${treg3}.wywx\n
			movc ${treg0}.xyzw, ${treg1}.xxxx, ${treg3}.xyzw, ${treg0}.xyzw\n
			min ${treg1}.x, ${treg0}.y, ${treg0}.w\n
			add ${treg1}.x, ${treg0}.x, -${treg1}.x\n
			mad ${treg1}.y, ${treg1}.x, l(6.000000), l(0.000000)\n
			add ${treg0}.y, -${treg0}.y, ${treg0}.w\n
			div ${treg0}.y, ${treg0}.y, ${treg1}.y\n
			add ${treg0}.y, ${treg0}.y, ${treg0}.z\n
	; HUE
			add ${treg0}.z, ${shift}.x, |${treg0}.y|\n
			ge ${treg0}.w, ${treg0}.z, -${treg0}.z\n
			frc ${treg0}.z, |${treg0}.z|\n
			movc ${treg0}.z, ${treg0}.w, ${treg0}.z, -${treg0}.z\n
			ge ${treg0}.w, |${treg0}.y|, l(0.266000)\n
			mov ${treg0}.w, l(1.0)\n
			movc ${treg0}.y, ${treg0}.w, ${treg0}.z, |${treg0}.y|\n
			add ${treg0}.yzw, ${treg0}.yyyy, l(0.000000, 1.000000, 0.666667, 0.333333)\n
			frc ${treg0}.yzw, ${treg0}.yyzw\n
			mad ${treg0}.yzw, ${treg0}.yyzw, l(0.000000, 6.000000, 6.000000, 6.000000), l(0.000000, -3.000000, -3.000000, -3.000000)\n
			add_sat ${treg0}.yzw, |${treg0}.yyzw|, l(0.000000, -1.000000, -1.000000, -1.000000)\n
			add ${treg0}.yzw, ${treg0}.yyzw, l(0.000000, -1.000000, -1.000000, -1.000000)\n
			add ${treg1}.y, ${treg0}.x, l(0.000000)\n
	; VAL
			add ${treg0}.x, ${treg0}.x, ${shift}.z\n
			min ${treg0}.x, ${treg0}.x, l(1.0)\n
			max ${treg0}.x, ${treg0}.x, l(0.0)\n
			div ${treg1}.x, ${treg1}.x, ${treg1}.y\n
	; SAT
			add ${treg1}.x, ${treg1}.x, ${shift}.y\n
			max ${treg1}.x, ${treg1}.x, l(0.0)\n
			mad ${treg0}.yzw, ${treg1}.xxxx, ${treg0}.yyzw, l(0.000000, 1.000000, 1.000000, 1.000000)\n
			mul ${color}.xyz, ${treg0}.yzwy, ${treg0}.xxxx\n
			mul ${color}.xyz, ${color}.xyz, ${color}.w\n
	; Calculate final colour and glow
			; mul o0.xyz, ${color}.xyz, ${shift}.w\n
		endif\n
	endif\n
endif\n

; ${fluffsplit:+

; 	${fluffsplit}

; }

${lightmapsplit:+

	${lightmapsplit}

}

${lightmap:+

	if_nz ${TSRReg1}.y\n
		${lightmaphead}t71${lightmaptail}
	else\n
		${lightmap}
	endif\n

}

${split:+

	${split}

}

${normalmap:+

	if_nz ${TSRReg1}.z\n
		${normalmaphead}t72${normalmaptail}
	else\n
		${normalmap}
	endif\n

}

${rainmap:+

	${rainsplit}

	if_nz ${TSRReg1}.w\n
		${rainmaprhead}t74${rainmaprtail}
	else\n
		${rainmapr}
	endif\n

	${multichannelrain:+

		if_nz ${TSRReg1}.w\n
			${rainmapghead}t74${rainmapgtail}
		else\n
			${rainmapg}
		endif\n

		${bluesplit}

		if_nz ${TSRReg1}.w\n
			${rainmapbhead}t74${rainmapbtail}
		else\n
			${rainmapb}
		endif\n
			
	}

	${endif}

}

${normalmap2:+

	if_nz ${TSRReg1}.z\n
		${normalmap2head}t72${normalmap2tail}
	else\n
		${normalmap2}
	endif\n

}

${body}

if_nz ${override}.x\n
	mul o0.xyz, ${color}.xyz, ${shift}.w\n
else\n
	${output}
endif\n

${elseoutput:+

	${outputsplit}

	if_nz ${override}.x\n
		mul o0.xyz, ${color}.xyz, ${shift}.w\n
	else\n
		${auxoutput}
	endif\n
	
}

