mov ${tcoord}.xyzw, ${texcoordreg}\n

if_nz ${TSRReg1}.x\n
	${diffusehead}t70${diffusetail}
else\n
	${diffuse}
endif\n

ld_indexable(texture1d)(float,float,float,float) ${ini}.xyzw, l(172, 0), t120.xyzw\n

if_nz ${ini}.x\n

	resinfo_indexable(texture2d)(float,float,float,float) ${treg0}.xyyy, l(0), t61.xyzw\n
	add ${treg1}.x, ${treg0}.x, ${treg0}.y\n
	if_nz ${treg1}.x\n
	
		mul ${treg0}.xyyy, ${treg0}.xyyy, ${tcoord}.xyyy%1\n
		mov ${treg0}.zw, l(0,0)\n
		ftoi ${treg0}.xyyy, ${treg0}.xyyy\n
		ld_aoffimmi_indexable(1,1,1)(texture2d)(float,float,float,float) ${tmask}.xyzw, ${treg0}.xy, t61.xyzw\n

; Fallback to sample if load fails
		if_z ${tmask}.w\n
			sample_indexable(texture2d)(float,float,float,float) ${tmask}.xyzw, ${tcoord}.xy, t61.xyzw, s0\n
		endif\n

		lt ${treg0}.x, ${tmask}.w, l(1.0)\n
		if_nz ${treg0}.x\n
			discard_z l(0)\n
		endif\n
	endif\n

endif\n

${output}

