# SPDX-License-Identifier: GPL-3.0-or-later
name: 测试与构建

# ⚠️ **2026-11-07 起：不再依赖 GitHub Actions 跑测试**
# 维护者取消了 Actions 的 run，并明确要求「所有写了相关的流程全部改掉，都用本地的」。
# 所以本工作流**只在手动触发时**运行（`workflow_dispatch`），push / PR 都不会再起 run；
# 日常与交付前的验证一律在本机跑：
#     python scripts/run_tests.py tests --serial      # 全量，实测 1453 passed / 约 3 分 10 秒
#     python scripts/run_tests.py --changed           # 改完先快速过一遍相关用例
# （串行是硬约定：这套测试是文件 IO 密集型，并行 worker 互相拖，见 CONTRIBUTING.md。）
#
# 保留这个文件只为「换机器 / 想用云 runner 手动兜底」这一种场景。
# runner 必须用 **windows-latest**：这套测试大量依赖 Windows —— `robocopy`、注册表、
# 拿 `System32` 里的模块做基准、长路径语义、`.exe` 路径等，ubuntu 上会大面积失败。
on:
  workflow_dispatch:          # 只有手动触发（push / PR 不再自动跑）

jobs:
  test:
    name: 全量测试
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # ⚠️ **关键**：Windows runner 的 stdout 是 **cp1252**，而本仓库不少脚本会 print 中文。
      # 实测崩过两次、且都是"活儿全干对了、只是最后那句中文 print 抛 UnicodeEncodeError"：
      #   * `scripts/test_addon_hook.py`（21 项断言全过，脚本仍以退出码 1 收场）
      #   * `scripts/build_exe.py`（`print("打包命令：…")`）
      # 设了它，**所有** Python 子进程的 stdout/stderr 一律 UTF-8，不必逐个脚本去补 reconfigure。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # 与维护者本机一致（3.12）
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-xdist pyflakes

      - name: 全量测试
        # 走项目自己的测试入口 `scripts/run_tests.py`，而不是裸 pytest：
        #   * **自带偶发失败重试**（项目既定约定：批量不 fail-fast、失败项自动重试、上限 3 次）
        #     —— 这套测试大量碰真实文件与注册表，Windows 上偶发「文件被另一个进程占用」，
        #     裸 pytest 会让整条 CI 白红（2026-10-10 撞到过一次）；
        #   * `--serial` 固定单线程（runner 磁盘同样是瓶颈，并行更慢）；
        #   * 失败时会把 FAILED 行摘出来，比裸 pytest 好读。
        run: python scripts/run_tests.py tests --serial

  build:
    name: 构建 exe
    needs: test
    # 构建只在手动触发时做（2026-11-07 起整个工作流都只在手动触发时运行）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # ⚠️ **关键**：Windows runner 的 stdout 是 **cp1252**，而本仓库不少脚本会 print 中文。
      # 实测崩过两次、且都是"活儿全干对了、只是最后那句中文 print 抛 UnicodeEncodeError"：
      #   * `scripts/test_addon_hook.py`（21 项断言全过，脚本仍以退出码 1 收场）
      #   * `scripts/build_exe.py`（`print("打包命令：…")`）
      # 设了它，**所有** Python 子进程的 stdout/stderr 一律 UTF-8，不必逐个脚本去补 reconfigure。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 构建 exe（面板产物已在仓库里，跳过重编）
        # `assets/addon/endfieldmodcontroller.addon64` 已随仓库分发（2026-10-10 起），
        # 所以不需要 C++ 编译器：`--skip-addon` 直接用仓库里那份。
        # 前端产物 `web/dist/index.html` 同样在仓库里 ⇒ 不需要 node。
        run: python scripts/build_exe.py --skip-addon

      - name: 写出 build-info.json（发版闸 `prepare_release.py` 要读它）
        # 本机构建时这份文件由 `build_release.py` 写；CI 走的是 `build_exe.py`，所以这里补上，
        # 内容与本地一致（version / artifact / sha256 / built_at），这样下载回来就能直接发版。
        run: |
          python -c "import sys, hashlib, json, pathlib, datetime; sys.path.insert(0, '.'); from endfieldmodcontroller.version import __version__; p = pathlib.Path('dist/EndfieldModController.exe'); h = hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path('dist/build-info.json').write_text(json.dumps({'version': __version__, 'artifact': p.name, 'sha256': h, 'built_at': datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}, ensure_ascii=False, indent=2), encoding='utf-8'); print('版本  ', __version__); print('大小  ', f'{p.stat().st_size:,} B'); print('sha256', h)"

      - name: 生成随包资产包（Release 另一个附件）
        run: python scripts/build_assets_bundle.py

      - name: 上传 Release 附件（exe + build-info + assets-bundle）
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/EndfieldModController.exe
            dist/build-info.json
            dist/assets-bundle.zip
          if-no-files-found: error
          retention-days: 30
