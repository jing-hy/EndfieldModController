<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>EndfieldModController</title>
    <!-- ★ 首屏主色：必须在 <head> 内联、在样式表之前生效，否则会先闪一下默认色
         （用户 2026-10-01 要求「启动最开始就要扫主色调的配置换启动页主色」）。
         2026-11-28 起主题拆成「底色 + 强调色」：白名单与 store.js 的
         THEME_BASES / THEME_ACCENTS 必须保持一致，旧值（amber/...）在这里迁移。 -->
    <script>
      (function () {
        try {
          var bases = ["light", "dark"];
          var accents = ["blue", "amber", "cyan", "violet", "emerald"];
          var legacy = { amber: "amber", cyan: "cyan", violet: "violet", emerald: "emerald" };
          var t = localStorage.getItem("mc-theme") || "light";
          var a = localStorage.getItem("mc-theme-accent") || "blue";
          if (legacy[t]) { a = legacy[t]; t = "dark"; }
          if (bases.indexOf(t) < 0) t = "light";
          if (accents.indexOf(a) < 0) a = "blue";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-theme-accent", a);
        } catch (e) { /* 隐私模式忽略 */ }
      })();
    </script>

gain with One-click launch or Generate controller.",回滚:"Roll back",保持现状:"Keep as is","正在回滚控制器产物…":"Rolling back controller output…",回滚失败:"Rollback failed",已回滚:"Rolled back",一键还原游戏本体:"Restore the vanilla game","会把游戏目录里所有**第三方插件文件移走**，恢复成原版状态。":"Moves all **third-party plugin files** out of the game folder and restores a vanilla install.","· 会**先整体备份**，随时可以用「从备份还原游戏目录」搬回来":"· **A full backup is taken first**, so Restore game folder from backup can bring it back any time","· loader proxy 会用系统原版文件补回":"· The loader proxy is restored with the system original","· Mod 库、配置与已装组件都不受影响":"· Mod library, config and installed components are untouched",备份并还原:"Back up and restore",先不还原:"Not now","正在备份并还原游戏本体…（文件较多，请稍候）":"Backing up and restoring the game files… (many files, please wait)",还原失败:"Restore failed",游戏本体已还原:"Vanilla game restored","游戏目录已恢复为原版状态。":"The game folder is back to vanilla.",共处理:"Processed","已自动填入：":"Filled in automatically: ","、":", ",检测到:"Detected","项，但都已填过（不覆盖你的设置）":"items, but all were already filled in (your settings are kept)",没有检测到可自动填入的路径:"No auto-fillable paths were detected","拿不到这个路径：":"Cannot get the path for: ",打不开这个目录:"Cannot open this folder",没能选择背景图:"Could not select a background image",背景图已设置:"Background image set",清除失败:"Failed to clear",背景图已清除:"Background image cleared","Web 服务没能启动":"The web service failed to start","本机 Web 服务已开启":"Local web service enabled","本机 Web 服务已关闭":"Local web service disabled",清理失败:"Cleanup failed",已清理:"Cleaned",拿不到这个路径:"Cannot get this path",打不开这个位置:"Cannot open this location","当前是源码运行，没有 exe 目录":"Running from source; there is no exe folder",启动行为:"Startup behavior","使用内置 XXMI/EFMI":"Use the bundled XXMI/EFMI",启动前自动更新依赖:"Update dependencies automatically before launch",启动时请求管理员权限:"Request administrator rights on launch","启动前清除游戏目录里的所有第三方注入（先备份）":"Clear all third-party injections from the game folder before launch (backed up first)","默认开。每次点「一键启动」时，先把游戏目录里原版不会有的注入痕迹全部移走 —— 不管是不是本程序装的（各种 proxy DLL、plugin 下的插件、3DMigoto 的 d3dx.ini / ShaderFixes、OptiScaler、ReShade 残留、被替换的 nvngx…），再把系统原版补回去；随后自检按你现在的开关把本程序要用的那一份重新铺好，所以功能不会因此失效。移走的东西整体备份在 runtime\\game_backup\\，随时可用「撤销清除」原样放回。游戏正在运行时自动跳过。":"On by default. Every time One-click launch runs, anything in the game folder that a vanilla install would not have is moved away first — no matter who put it there (proxy DLLs, plugins under plugin, 3DMigoto's d3dx.ini / ShaderFixes, OptiScaler, ReShade leftovers, replaced nvngx…), and the system originals are put back. The self-check then re-deploys the copy this controller needs according to your current switches, so features do not break. Everything moved away is backed up under runtime\\game_backup\\ and can be put back as-is with Undo clearing. Skipped automatically while the game is running.","自动把游戏目录 / 程序目录加进 Windows Defender 白名单":"Add the game and program folders to the Windows Defender exclusion list automatically","默认开。安全软件把文件当威胁隔离掉是本项目已知的问题类（表现是「明明修好了，第二天又缺文件」「游戏突然起不来」）—— 开启后，检测到这两个目录不在 Defender 的排除项里就自动加上，而不是弹窗让你自己去点系统设置。⚠️ 只对 Windows Defender 有效：360 / 火绒这类没有通用的命令行排除接口，只能手动加。⚠️ 代价是这两个目录里的文件不再被 Defender 实时扫描。":"On by default. Security software quarantining files is a known issue class for this project (symptoms: it was fixed yesterday but files are missing again today; or the game suddenly will not start). When on, if either folder is not in Defender's exclusions it is added automatically instead of making you click through system settings. ⚠️ Works with Windows Defender only: 360 / Huorong have no general command-line exclusion interface, so those must be added by hand. ⚠️ The cost is that files in these two folders are no longer scanned in real time by Defender.","自动清理 XXMI 里的外来 Mod（收编进库后删掉）":"Clean foreign mods in XXMI automatically (adopt into the library, then delete)","默认开。XXMI 的 Mods 目录只该放本程序的产物；里面出现别的目录时（你手动丢进去的、别的整合包留下的）：先反向同步进 Mod 库（库里已有就只标记、不重复拷），再从 Mods 删掉，并自动勾选显示为开启。⚠️ 为什么必须删：它会和本程序随后生成的同角色 Mod 构成「同角色成对」，游戏会直接崩。关掉则原样保留。":"On by default. XXMI's Mods folder should only hold this controller's output; when other folders show up there (dropped in by you, or left by another pack) they are first synced back into the mod library (already present ones are only marked, not copied again), then removed from Mods and marked as enabled automatically. ⚠️ Why deleting is required: they pair up with the same-character mod this controller generates next and the game crashes outright. Turn this off to leave them untouched.",依赖包优先用控制器维护的那份:"Prefer the dependency package maintained by the controller","RabbitFX 这类依赖：同一时间只允许一份生效。开启时优先用控制器自己维护的 _deps 那份，屏蔽你手动放进库的。":"For dependencies such as RabbitFX only one copy may be active at a time. When on, the _deps copy maintained by the controller is preferred and a copy you dropped into the library is masked.",运行日志:"Run logs",启动时自动清理运行日志:"Clean run logs automatically on launch","只清理 runtime\\logs 下超过「保留天数」的文件；最近日志与诊断包不受影响。":"Only files under runtime\\logs older than the retention period are removed; recent logs and diagnostics bundles are untouched.","ReShade 与 DLSS5（仅完整版）":"ReShade and DLSS5 (Universal only)","游戏自带 DLSS 时自动停用喂帧组件":"Disable the frame-feeding addon when the game ships its own DLSS","终末地自带 DLSS 时，喂帧组件会与游戏自己的 DLSS 抢同一条 NGX 链路。开启时自检会把它停用（移进 runtime\\dlss5\\_disabled，可逆）—— 但只有游戏确实跑在 D3D12 时才停：被 XXMI/EFMI 强制 -force_d3d11 时游戏建不出自己的 DLSS，喂帧组件是 DLSS5 的必需环节，此时会保持启用。":"When Endfield ships its own DLSS, the frame-feeding addon competes with the game for the same NGX chain. With this on, the self-check disables it (moved into runtime\\dlss5\\_disabled, reversible) — but only while the game really runs on D3D12: when XXMI/EFMI forces -force_d3d11 the game cannot create its own DLSS, and the feeding addon is then a required part of DLSS5, so it stays enabled.","注入统一控制面板（自研 ReShade addon）":"Inject the unified control panel (custom ReShade addon)","放进 ReShade 真正读取的目录（d3d12.dll 所在处）。关掉后不注入面板；此时「整合 Mod 快捷键」会拒绝锁键。":"Placed where ReShade actually reads from (next to d3d12.dll). When off the panel is not injected, and the combined mod hotkey then refuses to lock keys.",面板自动用系统中文字体:"Use the system Chinese font for the panel automatically","ReShade 默认字体只有 ASCII，面板里的中文会显示成方块。开启时（仅在 Font 还为空时）自动指向系统中文字体，写前会备份。":"The default ReShade font only covers ASCII, so CJK text in the panel shows as boxes. When on (and only while Font is still empty) it points at the system Chinese font; the previous file is backed up before writing.",主题:"Theme",背景图片:"Background image",背景预览:"Background preview","工作区与 Mod 库（相对主路径）":"Workspace and mod library (relative to the main path)",主路径:"Main path",程序所在目录:"Program folder","程序所在目录，下面这些都相对它":"The folder the program lives in; everything below is relative to it","runtime 目录":"runtime folder","Mod 库目录":"Mod library folder","Mod 备份（默认开，关了就不备份）":"Mod backup (on by default; nothing is backed up when off)","关掉后不再把 Mod 库里的 Mod 复制进备份仓；已有的备份一个都不会删（只增不减）。":"When off, mods in the library are no longer copied into the backup store; existing backups are never deleted (it only grows).","留空 = 主路径下的 mod-backup（只增不减）":"Empty = mod-backup under the main path (only grows)","Staging Mods 目录":"Staging Mods folder","留空 = 自动：<主路径>/builtin/XXMI/EFMI/Mods":"Empty = auto: <main path>/builtin/XXMI/EFMI/Mods","EFMI 实际加载的位置":"Where EFMI actually loads mods from",依赖清单:"Dependency manifest","游戏与启动器（留空即自动搜索）":"Game and launcher (leave empty to auto-detect)",官方启动器:"Official launcher","留空 = 自动搜索 Hypergryph Launcher":"Empty = auto-detect Hypergryph Launcher","留空 = 自动搜索游戏目录":"Empty = auto-detect the game folder","留空 = 自动搜索":"Empty = auto-detect","3DMigoto Loader（可选）":"3DMigoto Loader (optional)","留空 = 用内置 migoto_loader.exe":"Empty = use the bundled migoto_loader.exe","组件目录（留空 = 按主路径自动推导）":"Component folders (empty = derived from the main path)",乳摇工具目录:"Jiggle tool folder","留空 = 自动：<主路径>/secondary_motion":"Empty = auto: <main path>/secondary_motion",装到别处时填这里:"Fill this in if you installed it elsewhere","Endfield Poser 安装包":"Endfield Poser package","留空 = 自动：<主路径>/poser":"Empty = auto: <main path>/poser","
