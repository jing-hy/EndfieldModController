<!DOCTYPE html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>EndfieldModController</title>
    <!-- ★ 首屏主色：必须在 <head> 内联、在样式表之前生效，否则会先闪一下默认色
         （用户 2026-10-01 要求「启动最开始就要扫主色调的配置换启动页主色」）。
         2026-11-28 起主题拆成「底色 + 强调色」：白名单与 store.js 的
         THEME_BASES / THEME_ACCENTS 必须保持一致，旧值（amber/...）在这里迁移。 -->
    <script>
      (function () {
        try {
          var bases = ["light", "dark"];
          var accents = ["blue", "amber", "cyan", "violet", "emerald"];
          var legacy = { amber: "amber", cyan: "cyan", violet: "violet", emerald: "emerald" };
          var t = localStorage.getItem("mc-theme") || "light";
          var a = localStorage.getItem("mc-theme-accent") || "blue";
          if (legacy[t]) { a = legacy[t]; t = "dark"; }
          if (bases.indexOf(t) < 0) t = "light";
          if (accents.indexOf(a) < 0) a = "blue";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-theme-accent", a);
        } catch (e) { /* 隐私模式忽略 */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
